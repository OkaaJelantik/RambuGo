<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Rambu Lalu Lintas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 min-h-screen flex items-center justify-center p-6 sm:p-10">
  
  <div class="flex flex-col gap-16 w-full max-w-5xl">
    
    <!-- Row 1: Larangan -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-10 place-items-center">
      <!-- 1. Dilarang Berhenti -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="white" stroke="#E53935" stroke-width="10"/>
        <text x="50" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="black">S</text>
        <line x1="20" y1="20" x2="80" y2="80" stroke="#E53935" stroke-width="10"/>
      </svg>

      <!-- 2. Dilarang Parkir -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="white" stroke="#E53935" stroke-width="10"/>
        <text x="50" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="54" text-anchor="middle" fill="black">P</text>
        <line x1="20" y1="20" x2="80" y2="80" stroke="#E53935" stroke-width="10"/>
      </svg>

      <!-- 3. Dilarang Putar Balik -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="white" stroke="#E53935" stroke-width="10"/>
        <path d="M 65 70 L 65 40 C 65 25, 35 25, 35 45 L 35 60" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/>
        <polygon points="22,55 35,78 48,55" fill="black"/>
        <line x1="20" y1="20" x2="80" y2="80" stroke="#E53935" stroke-width="10"/>
      </svg>
    </div>

    <!-- Row 2: Petunjuk -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-10 place-items-center">
      <!-- 1. Petunjuk Arah -->
      <svg viewBox="0 0 240 100" class="w-full h-auto max-w-[240px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <!-- Pole Structure -->
        <rect x="20" y="0" width="8" height="100" fill="#9CA3AF" />
        <rect x="10" y="25" width="20" height="6" fill="#9CA3AF" />
        <rect x="10" y="70" width="20" height="6" fill="#9CA3AF" />
        <path d="M 28 31 L 40 70" stroke="#9CA3AF" stroke-width="5"/>
        <!-- Sign -->
        <rect x="35" y="15" width="195" height="70" rx="6" fill="#007A33" stroke="white" stroke-width="3"/>
        <text x="45" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="white">KOTA DENPASAR</text>
        <path d="M 205 45 L 205 25 M 197 33 L 205 25 L 213 33" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="45" y="68" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="white">KOTA GIANYAR</text>
        <path d="M 190 63 L 215 63 M 207 55 L 215 63 L 207 71" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- 2. Titik Kumpul -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="92" height="92" rx="6" fill="#007A33" stroke="white" stroke-width="4"/>
        <!-- Corners Arrows -->
        <path d="M 16 16 L 30 30 M 20 30 L 30 30 L 30 20" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 84 16 L 70 30 M 80 30 L 70 30 L 70 20" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 16 70 L 30 56 M 20 56 L 30 56 L 30 66" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 84 70 L 70 56 M 80 56 L 70 56 L 70 66" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- People -->
        <g fill="white">
          <circle cx="37" cy="40" r="4.5"/>
          <path d="M 31 56 L 31 46 C 31 43 43 43 43 46 L 43 56 Z"/>
          <circle cx="63" cy="40" r="4.5"/>
          <path d="M 57 56 L 57 46 C 57 43 69 43 69 46 L 69 56 Z"/>
          <circle cx="50" cy="42" r="5.5"/>
          <path d="M 42 62 L 42 50 C 42 45 58 45 58 50 L 58 62 Z"/>
        </g>
        <line x1="12" y1="78" x2="88" y2="78" stroke="white" stroke-width="1.5"/>
        <text x="50" y="89" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5" text-anchor="middle" fill="white">Titik Kumpul</text>
      </svg>

      <!-- 3. Jalur Evakuasi -->
      <svg viewBox="0 0 200 100" class="w-full h-auto max-w-[240px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="192" height="92" rx="4" fill="#007A33" stroke="white" stroke-width="4"/>
        <rect x="10" y="10" width="180" height="80" fill="none" stroke="white" stroke-width="1"/>
        
        <!-- Running Figure -->
        <g stroke="white" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cx="48" cy="28" r="6.5" fill="white" stroke="none"/>
          <path d="M 46 38 L 52 56 M 52 56 L 62 56 L 62 72 M 52 56 L 40 70 L 26 70" />
          <path d="M 48 42 L 35 42 L 30 32 M 48 42 L 62 42 L 68 50" />
        </g>
        <!-- Open Door Frame -->
        <path d="M 80 82 L 80 18 L 115 18 L 115 82 Z" fill="none" stroke="white" stroke-width="5"/>
        <polygon points="115,18 132,26 132,90 115,82" fill="white"/>
        <!-- Arrow -->
        <polygon points="150,38 175,38 175,22 195,50 175,78 175,62 150,62" fill="white"/>
      </svg>
    </div>

    <!-- Row 3: Peringatan -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-10 place-items-center">
      <!-- 1. Pejalan Kaki -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,5 95,50 50,95 5,50" fill="#FBC02D" stroke="black" stroke-width="2"/>
        <polygon points="50,9 91,50 50,91 9,50" fill="none" stroke="black" stroke-width="1.5"/>
        
        <!-- Zebra Cross (Perspective) -->
        <path d="M 23 80 L 36 80 L 40 72 L 29 72 Z M 42 80 L 58 80 L 60 72 L 46 72 Z M 64 80 L 77 80 L 75 72 L 64 72 Z" fill="black"/>
        <!-- Walking Figure -->
        <circle cx="50" cy="24" r="7.5" fill="black"/>
        <path d="M 50 34 C 52 44, 49 52, 47 58" fill="none" stroke="black" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M 47 58 L 38 74 L 44 84 M 47 58 L 60 68 L 71 68" fill="none" stroke="black" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 50 38 L 40 45 L 34 35 M 50 38 L 62 48 L 56 60" fill="none" stroke="black" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- 2. Lampu Lalu Lintas -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,5 95,50 50,95 5,50" fill="#FBC02D" stroke="black" stroke-width="2"/>
        <polygon points="50,9 91,50 50,91 9,50" fill="none" stroke="black" stroke-width="1.5"/>
        <rect x="36" y="18" width="28" height="64" fill="black" rx="3"/>
        <circle cx="50" cy="30" r="7.5" fill="#E53935"/>
        <circle cx="50" cy="50" r="7.5" fill="#FFEB3B"/>
        <circle cx="50" cy="70" r="7.5" fill="#4CAF50"/>
      </svg>

      <!-- 3. Persimpangan -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,5 95,50 50,95 5,50" fill="#FBC02D" stroke="black" stroke-width="2"/>
        <polygon points="50,9 91,50 50,91 9,50" fill="none" stroke="black" stroke-width="1.5"/>
        <path d="M 28 50 L 72 50 M 50 28 L 50 72" stroke="black" stroke-width="16" stroke-linecap="square"/>
      </svg>
    </div>

    <!-- Row 4: Perintah -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-10 place-items-center">
      <!-- 1. Wajib Belok Kiri -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#1976D2" stroke="white" stroke-width="2"/>
        <circle cx="50" cy="50" r="48" fill="none" stroke="#1976D2" stroke-width="1"/>
        <path d="M 65 75 L 65 50 C 65 35, 50 35, 38 35" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
        <polygon points="20,35 44,18 44,52" fill="white"/>
      </svg>

      <!-- 2. Wajib Lurus -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#1976D2" stroke="white" stroke-width="2"/>
        <circle cx="50" cy="50" r="48" fill="none" stroke="#1976D2" stroke-width="1"/>
        <path d="M 50 85 L 50 35" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
        <polygon points="50,15 30,38 70,38" fill="white"/>
      </svg>

      <!-- 3. Wajib Belok Kanan -->
      <svg viewBox="0 0 100 100" class="w-full h-auto max-w-[140px] drop-shadow-xl hover:scale-105 transition-transform duration-300" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#1976D2" stroke="white" stroke-width="2"/>
        <circle cx="50" cy="50" r="48" fill="none" stroke="#1976D2" stroke-width="1"/>
        <path d="M 35 75 L 35 50 C 35 35, 50 35, 62 35" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
        <polygon points="80,35 56,18 56,52" fill="white"/>
      </svg>
    </div>

  </div>
</body>
</html>
